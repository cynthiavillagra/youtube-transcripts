<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transcripciones de YouTube</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --texto: #1f1d1a; --suave: #6b665e; --borde: #e3dfd7;
    --acento: #c4302b; --acento-txt: #ffffff; --ok: #2f7d4f; --mal: #b3261e; --consola: #1d1c1a; --consola-txt: #e9e6df;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161513; --panel: #201f1c; --texto: #ece9e2; --suave: #a19c92; --borde: #34322d;
            --acento: #e5534b; --ok: #5cbf86; --mal: #f08a80; --consola: #0f0e0d; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--texto);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 28px 16px 60px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--suave); margin: 0 0 24px; }
  section { background: var(--panel); border: 1px solid var(--borde); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
  h2 { font-size: 1rem; margin: 0 0 12px; }
  label { display: block; }
  textarea { width: 100%; min-height: 150px; resize: vertical; padding: 10px; border-radius: 8px;
             border: 1px solid var(--borde); background: var(--bg); color: var(--texto); font: 13px/1.5 ui-monospace, Consolas, monospace; }
  textarea.arrastrando { outline: 2px dashed var(--acento); }
  .ayuda { color: var(--suave); font-size: .85rem; margin: 6px 0 0; }
  .grilla { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; }
  fieldset { border: 0; padding: 0; margin: 0; }
  legend { font-weight: 600; margin-bottom: 6px; font-size: .9rem; }
  .check { display: flex; gap: 8px; align-items: flex-start; margin: 4px 0; cursor: pointer; }
  .check input { margin-top: 4px; }
  .check small { color: var(--suave); display: block; }
  input[type=text], input[type=number] { width: 100%; padding: 7px 9px; border-radius: 8px; border: 1px solid var(--borde);
             background: var(--bg); color: var(--texto); font: inherit; }
  .campo { margin-bottom: 10px; }
  .campo span { font-size: .85rem; color: var(--suave); }
  .acciones { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  button { font: inherit; border-radius: 8px; padding: 9px 16px; cursor: pointer; border: 1px solid var(--borde);
           background: var(--panel); color: var(--texto); }
  button.principal { background: var(--acento); color: var(--acento-txt); border-color: var(--acento); font-weight: 600; }
  button:disabled { opacity: .55; cursor: wait; }
  #estado { color: var(--suave); font-size: .9rem; }
  pre#log { background: var(--consola); color: var(--consola-txt); border-radius: 8px; padding: 12px; margin: 12px 0 0;
            max-height: 340px; overflow: auto; font: 12.5px/1.55 ui-monospace, Consolas, monospace; white-space: pre-wrap; display: none; }
  .grupo { border-top: 1px solid var(--borde); padding: 10px 0; }
  .grupo:first-child { border-top: 0; padding-top: 0; }
  .grupo-cab { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grupo-cab strong { font-size: .95rem; }
  .grupo-cab .botones { display: flex; gap: 6px; }
  .grupo-cab button { padding: 4px 10px; font-size: .82rem; }
  ul { list-style: none; padding: 0; margin: 6px 0 0; }
  li { font-size: .88rem; padding: 2px 0; }
  li a { color: var(--texto); text-decoration: none; border-bottom: 1px dotted var(--suave); }
  li a:hover { color: var(--acento); }
  li .kb { color: var(--suave); font-size: .78rem; }
  .vacio { color: var(--suave); font-size: .9rem; }
  details summary { cursor: pointer; color: var(--suave); font-size: .85rem; }
</style>
</head>
<body>
<main>
  <h1>Transcripciones de YouTube</h1>
  <p class="sub">Videos sueltos, varios links o playlists enteras. Todo queda guardado en la carpeta <code>transcripciones/</code>.</p>

  <section>
    <h2>1. Links</h2>
    <label for="links" class="ayuda" style="margin:0 0 6px">Uno por línea. Podés mezclar videos, shorts y playlists. También podés arrastrar acá un archivo <code>.txt</code>.</label>
    <textarea id="links" placeholder="https://www.youtube.com/watch?v=...&#10;https://youtu.be/...&#10;https://www.youtube.com/playlist?list=..."></textarea>
    <p class="ayuda" id="contador"></p>
  </section>

  <section>
    <h2>2. Opciones</h2>
    <div class="grilla">
      <fieldset>
        <legend>Formatos</legend>
        <label class="check"><input type="checkbox" name="formato" value="txt" checked><span>Texto (.txt)<small>texto corrido en párrafos</small></span></label>
        <label class="check"><input type="checkbox" name="formato" value="md" checked><span>Markdown (.md)<small>con minutos clickeables</small></span></label>
        <label class="check"><input type="checkbox" name="formato" value="txt-tiempos"><span>Texto con tiempos<small>una línea por fragmento</small></span></label>
        <label class="check"><input type="checkbox" name="formato" value="srt"><span>Subtítulos (.srt)</span></label>
        <label class="check"><input type="checkbox" name="formato" value="json"><span>Datos (.json)</span></label>
      </fieldset>
      <fieldset>
        <legend>Qué bajar</legend>
        <label class="check"><input type="checkbox" id="unir" checked><span>Unir todo en un archivo por playlist<small>ideal para cargar en NotebookLM</small></span></label>
        <label class="check"><input type="checkbox" id="solo_video"><span>Si el link es de un video dentro de una playlist, bajar solo ese video</span></label>
        <label class="check"><input type="checkbox" id="solo_manuales"><span>Solo subtítulos hechos a mano<small>ignora los automáticos</small></span></label>
        <label class="check"><input type="checkbox" id="sobrescribir"><span>Volver a bajar los que ya existen</span></label>
      </fieldset>
      <fieldset>
        <legend>Idioma</legend>
        <label class="campo"><span>Idiomas preferidos, en orden</span>
          <input type="text" id="idiomas" value="es,es-419,es-ES,es-AR,es-MX,en"></label>
        <label class="campo"><span>Si no hay, traducir a (vacío = no traducir)</span>
          <input type="text" id="traducir" value="es" placeholder="es"></label>
        <label class="campo"><span>Pausa entre videos (segundos)</span>
          <input type="number" id="pausa" value="1.5" min="0" step="0.5"></label>
      </fieldset>
    </div>
  </section>

  <section>
    <div class="acciones">
      <button class="principal" id="btn">Transcribir</button>
      <span id="estado"></span>
    </div>
    <pre id="log" aria-live="polite"></pre>
  </section>

  <section>
    <div class="grupo-cab" style="margin-bottom:10px">
      <h2 style="margin:0">Transcripciones guardadas</h2>
      <div class="botones"><button onclick="abrirCarpeta('')">Abrir carpeta</button><button onclick="cargarArchivos()">Actualizar</button></div>
    </div>
    <div id="archivos"><p class="vacio">Cargando…</p></div>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
const links = $('#links');

function contarLinks() {
  const n = links.value.split(/\s+/).filter(x => x && !x.startsWith('#')).length;
  $('#contador').textContent = n ? `${n} link(s)` : '';
  try { localStorage.setItem('yt-links', links.value); } catch (e) {}
}
try { links.value = localStorage.getItem('yt-links') || ''; } catch (e) {}
links.addEventListener('input', contarLinks); contarLinks();

// arrastrar un .txt con links
links.addEventListener('dragover', e => { e.preventDefault(); links.classList.add('arrastrando'); });
links.addEventListener('dragleave', () => links.classList.remove('arrastrando'));
links.addEventListener('drop', async e => {
  e.preventDefault(); links.classList.remove('arrastrando');
  const f = e.dataTransfer.files[0]; if (!f) return;
  const txt = await f.text();
  links.value = (links.value.trim() ? links.value.trim() + '\n' : '') + txt.trim();
  contarLinks();
});

async function transcribir() {
  const datos = {
    links: links.value,
    formatos: [...document.querySelectorAll('input[name=formato]:checked')].map(x => x.value),
    idiomas: $('#idiomas').value, traducir: $('#traducir').value.trim(), pausa: $('#pausa').value,
    unir: $('#unir').checked, solo_video: $('#solo_video').checked,
    solo_manuales: $('#solo_manuales').checked, sobrescribir: $('#sobrescribir').checked,
  };
  const r = await fetch('/api/trabajos', { method: 'POST', body: JSON.stringify(datos) });
  const j = await r.json();
  if (!r.ok) { $('#estado').textContent = j.error; return; }
  const log = $('#log'); log.textContent = ''; log.style.display = 'block';
  $('#btn').disabled = true; $('#estado').textContent = 'Transcribiendo… podés dejar esta pestaña abierta.';
  let desde = 0;
  while (true) {
    const e = await (await fetch(`/api/trabajos/${j.id}?desde=${desde}`)).json();
    if (e.log.length) { log.textContent += e.log.join('\n') + '\n'; log.scrollTop = log.scrollHeight; }
    desde = e.total;
    if (e.terminado) {
      $('#estado').textContent = e.codigo === 0 ? 'Terminado.' : 'Terminado con problemas: mirá el detalle arriba.';
      break;
    }
    await new Promise(res => setTimeout(res, 1000));
  }
  $('#btn').disabled = false; cargarArchivos();
}
$('#btn').addEventListener('click', transcribir);

async function cargarArchivos() {
  const grupos = await (await fetch('/api/archivos')).json();
  const cont = $('#archivos');
  if (!grupos.length) { cont.innerHTML = '<p class="vacio">Todavía no hay transcripciones.</p>'; return; }
  cont.innerHTML = '';
  for (const g of grupos) {
    const div = document.createElement('div'); div.className = 'grupo';
    const enc = encodeURIComponent(g.grupo);
    div.innerHTML = `<div class="grupo-cab"><strong></strong><div class="botones">
        <button data-a="abrir">Abrir</button><a href="/zip?grupo=${enc}"><button>Bajar .zip</button></a></div></div>
      <details><summary>${g.archivos.length} archivo(s)</summary><ul></ul></details>`;
    div.querySelector('strong').textContent = g.grupo;
    div.querySelector('[data-a=abrir]').onclick = () => abrirCarpeta(g.grupo);
    const ul = div.querySelector('ul');
    for (const a of g.archivos) {
      const li = document.createElement('li');
      const link = document.createElement('a');
      link.href = '/descargar?ruta=' + encodeURIComponent(a.ruta); link.textContent = a.nombre;
      li.append(link, Object.assign(document.createElement('span'), { className: 'kb', textContent: `  ${a.kb} KB` }));
      ul.append(li);
    }
    cont.append(div);
  }
}
async function abrirCarpeta(grupo) {
  await fetch('/api/abrir-carpeta', { method: 'POST', body: JSON.stringify({ grupo }) });
}
cargarArchivos();
</script>
</body>
</html>
